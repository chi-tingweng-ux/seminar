<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>115年度 EEW 成果交流會報名系統</title>
    <style>
        :root {
            --primary-color: #0056b3;
            --secondary-color: #f4f7f6;
            --accent-color: #ff9800;
            --text-color: #333;
            --white: #ffffff;
        }

        body {
            font-family: 'Helvetica Neue', Arial, '微軟正黑體', sans-serif;
            margin: 0;
            padding: 0;
            color: var(--text-color);
            background-color: var(--secondary-color);
            line-height: 1.6;
        }

        header {
            background-color: var(--primary-color);
            color: var(--white);
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            margin: 0;
            font-size: 2.5em;
        }

        header p {
            font-size: 1.2em;
            margin-top: 10px;
            opacity: 0.9;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section-card {
            background: var(--white);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        .section-card h2 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
            margin-top: 0;
        }

        .info-list {
            list-style: none;
            padding: 0;
        }

        .info-list li {
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .info-list span {
            font-weight: bold;
            color: var(--primary-color);
            display: inline-block;
            width: 100px;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1em;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        select:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 5px rgba(0, 86, 179, 0.3);
        }

        button.submit-btn {
            background-color: var(--accent-color);
            color: var(--white);
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        button.submit-btn:hover {
            background-color: #e68a00;
        }

        button.submit-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        /* Message Overlay */
        #message-box {
            display: none;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
        }

        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .loading { background-color: #e2e3e5; color: #383d41; }
    </style>
</head>
<body>

    <header>
        <h1>115年度 EEW 成果交流會</h1>
        <p>地震預警 (Earthquake Early Warning) 產官學技術研討與交流</p>
    </header>

    <div class="container">
        
        <div class="section-card">
            <h2>活動資訊</h2>
            <ul class="info-list">
                <li><span>活動日期：</span>115年 10月 20日 (週二) 09:00 - 16:30</li>
                <li><span>活動地點：</span>交通部中央氣象署 國際會議廳</li>
                <li><span>報名期限：</span>即日起至 115年 10月 10日止</li>
                <li><span>主辦單位：</span>交通部中央氣象署</li>
                <li><span>注意事項：</span>報名成功後，系統將自動發送「報到 QR Code」至您的信箱，活動當天請憑 QR Code 掃描入場。</li>
            </ul>
        </div>

        <div class="section-card">
            <h2>線上報名</h2>
            <form id="registrationForm">
                <div class="form-group">
                    <label for="name">姓名 *</label>
                    <input type="text" id="name" name="name" required placeholder="請輸入真實姓名">
                </div>
                
                <div class="form-group">
                    <label for="organization">服務單位/學校 *</label>
                    <input type="text" id="organization" name="organization" required placeholder="例如：國家地震工程研究中心">
                </div>

                <div class="form-group">
                    <label for="title">職稱 *</label>
                    <input type="text" id="title" name="title" required placeholder="例如：研究員、經理">
                </div>

                <div class="form-group">
                    <label for="email">電子信箱 (Email) *</label>
                    <input type="email" id="email" name="email" required placeholder="請確保填寫正確，以利接收報到 QR Code">
                </div>

                <div class="form-group">
                    <label for="phone">聯絡電話 *</label>
                    <input type="tel" id="phone" name="phone" required placeholder="09XX-XXX-XXX">
                </div>

                <div class="form-group">
                    <label for="diet">飲食習慣 (午餐)</label>
                    <select id="diet" name="diet">
                        <option value="葷食">葷食</option>
                        <option value="素食">素食</option>
                        <option value="不用餐">不用餐</option>
                    </select>
                </div>

                <button type="submit" id="submitBtn" class="submit-btn">確認送出報名</button>
            </form>

            <div id="message-box"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('registrationForm');
        const submitBtn = document.getElementById('submitBtn');
        const messageBox = document.getElementById('message-box');

        // ★★★ 請替換成您的 Google Apps Script (GAS) 部署後的 Web App 網址 ★★★
        const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/您的網址ID/exec'; 

        form.addEventListener('submit', function(e) {
            e.preventDefault(); // 防止網頁重新整理

            // 更新按鈕狀態為處理中
            submitBtn.disabled = true;
            submitBtn.textContent = '報名資料傳送中...';
            messageBox.className = 'loading';
            messageBox.textContent = '系統正在處理您的報名並生成 QR Code，請稍候...';
            messageBox.style.display = 'block';

            // 收集表單資料
            const formData = new FormData(form);
            const data = {};
            formData.forEach((value, key) => { data[key] = value });

            // 透過 Fetch API 傳送 POST 請求至 GAS
            fetch(GAS_WEB_APP_URL, {
                method: 'POST',
                // 因為 GAS CORS 限制，通常使用 text/plain 發送 JSON 格式資料，GAS 端解析
                body: JSON.stringify(data),
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8',
                }
            })
            .then(response => response.json())
            .then(result => {
                if (result.status === 'success') {
                    // 成功狀態
                    messageBox.className = 'success';
                    messageBox.textContent = '報名成功！系統已發送報到 QR Code 至您的信箱，請查收。';
                    form.reset(); // 清空表單
                } else {
                    // 失敗狀態
                    messageBox.className = 'error';
                    messageBox.textContent = '報名失敗，請稍後再試或聯繫主辦單位。原因：' + result.message;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                messageBox.className = 'error';
                messageBox.textContent = '網路連線異常，請確認網路狀態後重試！';
            })
            .finally(() => {
                // 恢復按鈕狀態
                submitBtn.disabled = false;
                submitBtn.textContent = '確認送出報名';
            });
        });
    </script>
</body>
</html>
